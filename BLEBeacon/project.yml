name: BLEBeacon
options:
  bundleIdPrefix: com.arthuril
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  BLEBeacon:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: BLE Beacon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # CoreBluetooth peripheral use needs this or the app is killed on launch.
        NSBluetoothAlwaysUsageDescription: "Broadcast custom-named Bluetooth beacons that nearby scanners can see."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthuril.blebeacon
        PRODUCT_NAME: BLEBeacon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  BLEBeacon:
    build:
      targets:
        BLEBeacon: all
    run:
      config: Debug
    archive:
      config: Release
