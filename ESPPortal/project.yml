name: ESPPortal
options:
  bundleIdPrefix: com.arthuril
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  ESPPortal:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ESP Portal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "Connect to your ESP32 to configure its WiFi access point and beacon."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthuril.espportal
        PRODUCT_NAME: ESPPortal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  ESPPortal:
    build:
      targets:
        ESPPortal: all
    run:
      config: Debug
    archive:
      config: Release
