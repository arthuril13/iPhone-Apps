name: Build HelloWorld IPA

# Builds an UNSIGNED .ipa on a free GitHub-hosted Mac.
# You then sign + install it with Sideloadly using your own Apple ID.
#
# IMPORTANT: XcodeGen 2.46 writes pbxproj "objectVersion = 77", which
# Xcode 15.4 (the macos-14 image) cannot read. The macos-15 image ships
# Xcode 16, which reads format 77 fine. Do not downgrade the runner.
#
# Steps must NOT use continue-on-error: that previously made a broken
# build report success and upload an empty 235-byte .ipa.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    defaults:
      run:
        working-directory: HelloWorld

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare log
        working-directory: .
        run: |
          mkdir -p ci-logs
          echo "CI diagnostics - $(date -u)" > ci-logs/diag.txt

      - name: Show toolchain versions
        run: |
          {
            echo "=== xcodebuild -version ==="
            xcodebuild -version
            echo "=== xcodegen ==="
            brew install xcodegen >/dev/null 2>&1
            xcodegen --version
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"

      - name: Generate Xcode project
        run: |
          echo "=== xcodegen generate ===" >> "$GITHUB_WORKSPACE/ci-logs/diag.txt"
          xcodegen generate 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"
          echo "objectVersion in generated project:" | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"
          grep -m1 objectVersion HelloWorld.xcodeproj/project.pbxproj | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"

      - name: List targets and schemes
        run: |
          echo "=== xcodebuild -list ===" >> "$GITHUB_WORKSPACE/ci-logs/diag.txt"
          xcodebuild -list -project HelloWorld.xcodeproj 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          echo "=== xcodebuild build ===" >> "$GITHUB_WORKSPACE/ci-logs/diag.txt"
          xcodebuild \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -80 | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"

      - name: Package into .ipa
        run: |
          set -o pipefail
          ls -la build/Build/Products/Release-iphoneos/ | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HelloWorld.app Payload/
          zip -qr HelloWorld.ipa Payload
          ls -lh HelloWorld.ipa | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"
          # A real .ipa is megabytes. Fail loudly if it is suspiciously small.
          size=$(stat -f%z HelloWorld.ipa)
          echo "ipa size bytes: $size" | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"
          if [ "$size" -lt 100000 ]; then
            echo "ERROR: .ipa is only $size bytes - build produced nothing real" | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"
            exit 1
          fi

      - name: Publish diagnostics back to repo
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/diag.txt
          git commit -m "CI diagnostics [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-ipa
          path: HelloWorld/HelloWorld.ipa
          if-no-files-found: error
