name: Build HelloWorld IPA

# Builds an UNSIGNED .ipa on a free GitHub-hosted Mac.
# You then sign + install it with Sideloadly using your own Apple ID.
#
# NOTES (hard-won):
#  - XcodeGen 2.46 writes pbxproj "objectVersion = 77". Xcode 15.4 on the
#    macos-14 image CANNOT read that. macos-15 ships Xcode 16 and works.
#    Do not downgrade the runner.
#  - Do NOT use continue-on-error: it made a broken build report success
#    and upload an empty 235-byte .ipa.
#  - Validate the .ipa by STRUCTURE, not by an arbitrary byte size. A
#    minimal unsigned SwiftUI app really does zip down to ~15 KB.
#  - The finished .ipa is committed to dist/ so it can be downloaded
#    without a GitHub login (artifact downloads require auth).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    defaults:
      run:
        working-directory: HelloWorld

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare log
        working-directory: .
        run: |
          mkdir -p ci-logs dist
          echo "CI diagnostics - $(date -u)" > ci-logs/diag.txt

      - name: Show toolchain versions
        run: |
          {
            echo "=== xcodebuild -version ==="
            xcodebuild -version
            echo "=== xcodegen ==="
            brew install xcodegen >/dev/null 2>&1
            xcodegen --version
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"

      - name: Generate Xcode project
        run: |
          xcodegen generate 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -25 | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"

      - name: Package into .ipa
        run: |
          set -o pipefail
          APP=build/Build/Products/Release-iphoneos/HelloWorld.app
          {
            echo "=== packaging ==="
            ls -la "$APP"
            echo "--- app bundle size ---"
            du -sh "$APP"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr HelloWorld.ipa Payload

          # Validate by STRUCTURE, not size.
          {
            echo "--- ipa contents ---"
            unzip -l HelloWorld.ipa
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"

          test -f Payload/HelloWorld.app/HelloWorld || { echo "ERROR: no executable in bundle"; exit 1; }
          test -f Payload/HelloWorld.app/Info.plist || { echo "ERROR: no Info.plist in bundle"; exit 1; }
          file Payload/HelloWorld.app/HelloWorld | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"
          file Payload/HelloWorld.app/HelloWorld | grep -q "Mach-O" || { echo "ERROR: executable is not Mach-O"; exit 1; }
          echo "IPA OK: $(stat -f%z HelloWorld.ipa) bytes" | tee -a "$GITHUB_WORKSPACE/ci-logs/diag.txt"

      - name: Copy .ipa into dist for direct download
        run: cp HelloWorld.ipa "$GITHUB_WORKSPACE/dist/HelloWorld.ipa"

      - name: Publish .ipa and diagnostics back to repo
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/diag.txt
          git add -f dist/HelloWorld.ipa || true
          git commit -m "CI: publish ipa + diagnostics [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-ipa
          path: HelloWorld/HelloWorld.ipa
          if-no-files-found: error
