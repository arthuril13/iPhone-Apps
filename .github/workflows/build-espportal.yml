name: Build ESPPortal IPA

on:
  push:
    branches: [main]
    paths:
      - 'ESPPortal/**'
      - '.github/workflows/build-espportal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ESPPortal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare log
        working-directory: .
        run: mkdir -p ci-logs dist && echo "ESPPortal CI - $(date -u)" > ci-logs/espportal.txt

      - name: Toolchain
        run: |
          { xcodebuild -version; brew install xcodegen >/dev/null 2>&1; xcodegen --version; } \
            2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/espportal.txt"

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/espportal.txt"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ESPPortal.xcodeproj \
            -scheme ESPPortal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -50 | tee -a "$GITHUB_WORKSPACE/ci-logs/espportal.txt"

      - name: Package into .ipa
        run: |
          set -o pipefail
          APP=build/Build/Products/Release-iphoneos/ESPPortal.app
          ls -la "$APP" 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/espportal.txt"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr ESPPortal.ipa Payload
          test -f Payload/ESPPortal.app/ESPPortal || { echo "ERROR: no executable"; exit 1; }
          file Payload/ESPPortal.app/ESPPortal | grep -q "Mach-O" || { echo "ERROR: not Mach-O"; exit 1; }
          echo "IPA OK: $(stat -f%z ESPPortal.ipa) bytes" | tee -a "$GITHUB_WORKSPACE/ci-logs/espportal.txt"

      - name: Copy .ipa into dist
        run: cp ESPPortal.ipa "$GITHUB_WORKSPACE/dist/ESPPortal.ipa"

      - name: Publish .ipa + log back to repo
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/espportal.txt dist/ESPPortal.ipa || true
          git commit -m "CI: publish ESPPortal ipa + log [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESPPortal-ipa
          path: ESPPortal/ESPPortal.ipa
          if-no-files-found: error
