name: Build ESPStudio IPA

on:
  push:
    branches: [main]
    paths:
      - 'ESPStudio/**'
      - '.github/workflows/build-espstudio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ESPStudio

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare log
        working-directory: .
        run: mkdir -p ci-logs dist && echo "ESPStudio CI - $(date -u)" > ci-logs/espstudio.txt
      - name: Toolchain
        run: |
          { xcodebuild -version; brew install xcodegen >/dev/null 2>&1; xcodegen --version; } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/espstudio.txt"
      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/espstudio.txt"
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ESPStudio.xcodeproj -scheme ESPStudio -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -60 | tee -a "$GITHUB_WORKSPACE/ci-logs/espstudio.txt"
      - name: Package into .ipa
        run: |
          set -o pipefail
          APP=build/Build/Products/Release-iphoneos/ESPStudio.app
          ls -la "$APP" 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/espstudio.txt"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr ESPStudio.ipa Payload
          file Payload/ESPStudio.app/ESPStudio | grep -q "Mach-O" || { echo "ERROR: not Mach-O"; exit 1; }
          echo "IPA OK: $(stat -f%z ESPStudio.ipa) bytes" | tee -a "$GITHUB_WORKSPACE/ci-logs/espstudio.txt"
      - name: Copy .ipa into dist
        run: cp ESPStudio.ipa "$GITHUB_WORKSPACE/dist/ESPStudio.ipa"
      - name: Publish .ipa + log
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/espstudio.txt dist/ESPStudio.ipa || true
          git commit -m "CI: publish ESPStudio ipa + log [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || true
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESPStudio-ipa
          path: ESPStudio/ESPStudio.ipa
          if-no-files-found: error
