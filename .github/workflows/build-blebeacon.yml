name: Build BLEBeacon IPA

on:
  push:
    branches: [main]
    paths:
      - 'BLEBeacon/**'
      - '.github/workflows/build-blebeacon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: BLEBeacon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare log
        working-directory: .
        run: mkdir -p ci-logs dist && echo "BLEBeacon CI - $(date -u)" > ci-logs/blebeacon.txt

      - name: Toolchain
        run: |
          { xcodebuild -version; brew install xcodegen >/dev/null 2>&1; xcodegen --version; } \
            2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/blebeacon.txt"

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/blebeacon.txt"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BLEBeacon.xcodeproj \
            -scheme BLEBeacon \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -40 | tee -a "$GITHUB_WORKSPACE/ci-logs/blebeacon.txt"

      - name: Package into .ipa
        run: |
          set -o pipefail
          APP=build/Build/Products/Release-iphoneos/BLEBeacon.app
          ls -la "$APP" 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/blebeacon.txt"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr BLEBeacon.ipa Payload
          test -f Payload/BLEBeacon.app/BLEBeacon || { echo "ERROR: no executable"; exit 1; }
          file Payload/BLEBeacon.app/BLEBeacon | grep -q "Mach-O" || { echo "ERROR: not Mach-O"; exit 1; }
          echo "IPA OK: $(stat -f%z BLEBeacon.ipa) bytes" | tee -a "$GITHUB_WORKSPACE/ci-logs/blebeacon.txt"

      - name: Copy .ipa into dist
        run: cp BLEBeacon.ipa "$GITHUB_WORKSPACE/dist/BLEBeacon.ipa"

      - name: Publish .ipa + log back to repo
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/blebeacon.txt dist/BLEBeacon.ipa || true
          git commit -m "CI: publish BLEBeacon ipa + log [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLEBeacon-ipa
          path: BLEBeacon/BLEBeacon.ipa
          if-no-files-found: error
